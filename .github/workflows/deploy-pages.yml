name: Publish Fit Zone site to GitHub Pages

# Publishes the static site to the gh-pages branch, which GitHub Pages
# serves at https://seifmohamedbahat-web.github.io/slap/
on:
  push:
    branches: [claude/fit-zone-gym-website-awfid1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
          enable_jekyll: false
